<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Generator</title>
</head>
<style>
    body{
        text-align: center;
        background-color: black;
        color: white;
    }
    h1{
        font-size: 70px;
        color: rgb(176, 176, 241);
    }
    h2{
        font-size: 40px;
        color: rgb(206, 204, 86);
    }
    button{
        background-color: black;
        color: white;
    }
    #result{
        font-size: 50px;
        font-weight: bold;
    }
    .guide{
        font-size: 20px;
        color: rgb(180, 243, 54);
    }
</style>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form>
            <p><label> Height (in cm.)  </label>
                <input type="text" id="height" />
            </p>
            <p><label> Weight (in Kg.)  </label>
                <input type="text" id="weight" />
            </p>
            <button>Calculate</button> <br> <br>
            <div id="result"></div> <br><br>
            <div class="weightguide">
                <h2>BMI Weight Guide</h1>
                <p class="guide">Under Weight = Less than 18.6</p>
                <p class="guide">Normal Range = 18.6 to 24.9</p>
                <p class="guide">Over Weight = More than 24.9</p>
            </div>
        </form>
    </div>

    <script defer src="script.js"></script>
</body>
</html>
